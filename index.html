<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Conteo de inventario en tienda y comparación con existencias del sistema." />
    <title>Conteo de inventario</title>
    <script>
      // Aplica el tema antes de pintar para evitar el destello claro/oscuro.
      try {
        var t = localStorage.getItem("conteo-totto:theme") || "system"
        var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(d ? "dark" : "light")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
